  <style>

    *{box-sizing:border-box}body{margin:0;background:var(--canvas);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:1260px;margin:0 auto;min-height:100vh;padding:0 34px 40px}.topbar{height:86px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:.03em;font-size:18px}.logo{height:34px;width:34px;border-radius:12px;background:#4D83A6;display:grid;place-items:center;color:#fff;font-size:18px}.top-right{display:flex;align-items:center;gap:16px}.date-label{color:#737d75;font-size:13px}.avatar{height:36px;width:36px;border-radius:50%;background:#e8ded1;color:#765b42;display:grid;place-items:center;font-size:13px;font-weight:700}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:34px}.sidebar{padding-top:11px}.nav-label{font-size:10px;color:#9aa19b;letter-spacing:.13em;margin:0 0 11px 13px}.nav{display:grid;gap:4px;margin-bottom:32px}.nav button{height:43px;border:0;background:transparent;color:#68736a;border-radius:11px;text-align:left;padding:0 13px;display:flex;align-items:center;gap:12px;font-size:13px}.nav button.active{background:#E8F2F6;color:#3F718D;font-weight:650}.nav .ico{font-size:16px;width:18px;text-align:center}.side-project{display:flex;align-items:center;gap:10px;padding:9px 12px;color:#5f6961;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#72B9A5;flex:none}.dot.amber{background:#d5a16c}.dot.blue{background:#7894af}.side-footer{margin-top:30px;padding:15px 14px;background:#EDF3F3;border-radius:14px;font-size:11px;color:#758078;line-height:1.7}.content{min-width:0;padding:8px 0 30px}.heading{display:flex;align-items:flex-end;justify-content:space-between;margin:0 0 22px}.heading-actions{display:flex;align-items:center;gap:8px}.eyebrow{font-size:11px;letter-spacing:.14em;color:#859087;margin-bottom:8px}.heading h1{font-size:29px;letter-spacing:-.04em;margin:0;font-weight:650}.heading p{margin:8px 0 0;color:#89928b;font-size:13px}.button-primary{background:var(--green);color:white;border:0;border-radius:10px;padding:11px 15px;font-size:12px;font-weight:600;box-shadow:0 5px 12px #4D83A626}.button-primary:hover{background:#3F718D}.button-quiet{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:#566159;font-size:12px}.hero{background:linear-gradient(118deg,#477C9C 0%,#4D9A9B 100%);color:#fff;border-radius:20px;padding:23px 25px;display:grid;grid-template-columns:1fr auto;align-items:center;position:relative;overflow:hidden;box-shadow:0 12px 26px #365d431c}.hero:after{content:"";position:absolute;width:250px;height:250px;border:1px solid #ffffff18;border-radius:50%;right:80px;top:-170px;box-shadow:0 0 0 28px #ffffff0a,0 0 0 58px #ffffff08}.hero-label{font-size:11px;color:#D9E8F0;letter-spacing:.1em}.hero h2{font-size:19px;margin:8px 0 6px;font-weight:600}.hero p{font-size:12px;color:#DCECF1;margin:0}.hero-right{text-align:right;z-index:1}.hero-right strong{font-size:32px;letter-spacing:-.05em}.hero-right small{display:block;font-size:10px;color:#DCECF1;margin-top:2px}.hero-link{position:absolute;right:24px;bottom:16px;font-size:11px;color:#E5F0F3;text-decoration:none;z-index:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0 24px}.stat{padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:14px}.stat-label{font-size:11px;color:#8c958e}.stat strong{font-size:22px;display:inline-block;margin-top:7px;letter-spacing:-.04em}.stat small{font-size:11px;color:#929a93;margin-left:5px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.section-head h3{font-size:15px;margin:0;font-weight:650}.section-head span{font-size:11px;color:#909991}.task-list{display:grid;gap:9px}.task{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:start;padding:15px 16px;background:#fff;border:1px solid var(--line);border-radius:14px;transition:.2s}.task.done{opacity:.62}.task.done .task-title{text-decoration:line-through}.check{appearance:none;width:19px;height:19px;border:1.5px solid #c8d0c8;border-radius:50%;margin:1px 0 0;display:grid;place-items:center;cursor:pointer}.check:checked{background:#4D83A6;border-color:#4D83A6}.check:checked:after{content:"✓";font-size:12px;color:white}.task-title{font-size:13px;font-weight:550;line-height:1.4}.task-meta{display:flex;gap:8px;align-items:center;margin-top:7px;color:#929a93;font-size:10px}.tag{padding:4px 7px;border-radius:5px;font-size:10px;white-space:nowrap}.tag.high{background:#fbefe8;color:#b56841}.tag.medium{background:#f3f1e8;color:#9b8652}.tag.low{background:#E8F5EF;color:#63816a}.task-time{color:#929a93;font-size:10px;margin-top:2px;white-space:nowrap}.task-actions{display:flex;gap:6px}.icon-btn{border:0;background:transparent;color:#a0a8a1;padding:2px 5px;font-size:15px}.lower-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.project-row{padding:13px 0;border-bottom:1px solid #f0f2ef}.project-row:last-child{border-bottom:0;padding-bottom:2px}.project-title-line{display:flex;justify-content:space-between;font-size:12px;font-weight:600}.project-title-line small{font-size:10px;color:#8b948c;font-weight:400}.bar{height:5px;border-radius:5px;background:#edf0ec;margin:10px 0 8px;overflow:hidden}.bar i{height:100%;display:block;border-radius:5px;background:#75BFAF}.project-sub{display:flex;justify-content:space-between;color:#929a93;font-size:10px}.goal-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid #f0f2ef}.goal-item:last-child{border:0}.goal-mark{height:25px;width:25px;border-radius:8px;background:#E8F5EF;color:#65AA96;display:grid;place-items:center;font-size:11px;flex:none}.goal-copy strong{font-size:11px;font-weight:600}.goal-copy p{font-size:10px;color:#929a93;margin:5px 0 0;line-height:1.5}.page{display:none}.page.show{display:block}.project-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.project-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;cursor:pointer;transition:.2s}.project-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.card-top{display:flex;justify-content:space-between;align-items:center}.project-card h3{font-size:14px;margin:13px 0 5px}.project-card p{font-size:11px;color:#8b948d;margin:0;line-height:1.5}.card-progress{display:flex;justify-content:space-between;font-size:10px;color:#879188;margin-top:17px}.filters{display:flex;gap:8px;align-items:center;margin-bottom:14px}.filters input,.filters select{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 11px;font-size:12px;color:#59635c}.empty{padding:30px;text-align:center;color:#929a93;font-size:12px}.modal-backdrop{position:fixed;inset:0;background:#1d292244;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal-backdrop.open{display:flex}.modal{width:min(470px,100%);background:#fff;border-radius:19px;padding:22px;box-shadow:0 25px 70px #17231d40;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal-head h2{font-size:18px;margin:0}.close{border:0;background:#f2f4f1;width:30px;height:30px;border-radius:50%;color:#667168;font-size:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;margin-bottom:12px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#737d75}.field input,.field textarea,.field select{width:100%;border:1px solid #e5e9e3;border-radius:9px;padding:10px 11px;outline:none;background:#fff;font-size:12px;color:#28322b}.field input:focus,.field textarea:focus,.field select:focus{border-color:#83B8B2;box-shadow:0 0 0 3px #83B8B21a}.field textarea{min-height:70px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:7px}.toast{position:fixed;bottom:32px;left:50%;transform:translate(-50%,20px);background:#25342a;color:white;padding:10px 15px;border-radius:10px;font-size:12px;opacity:0;transition:.25s;pointer-events:none;z-index:8}.toast.show{opacity:1;transform:translate(-50%,0)}.timeline{border-left:1px solid #dfe5de;margin:15px 0 0 5px;padding-left:18px}.timeline-entry{position:relative;padding:0 0 18px}.timeline-entry:before{content:"";position:absolute;width:8px;height:8px;background:#65AA96;border:2px solid white;box-shadow:0 0 0 1px #65AA96;border-radius:50%;left:-23px;top:4px}.timeline-entry strong{font-size:12px}.timeline-entry p{font-size:11px;color:#869087;margin:5px 0}.timeline-entry small{color:#a1a9a2;font-size:10px}.mobile-nav{display:none}
    @media(max-width:800px){.app{padding:0 20px 92px}.topbar{height:66px}.layout{display:block}.sidebar{display:none}.content{padding-top:9px}.heading h1{font-size:26px}.lower-grid{grid-template-columns:1fr}.hero{padding:19px 20px}.hero:after{right:-10px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(18px);border-top:1px solid #E4ECEF;justify-content:space-around;z-index:4}.mobile-nav button{border:0;background:transparent;color:#89928b;display:grid;justify-items:center;gap:3px;font-size:9px}.mobile-nav button.active{color:#4D83A6}.mobile-nav .ico{font-size:17px}.date-label{display:none}}
    @media(max-width:500px){.app{padding-left:15px;padding-right:15px}.topbar{height:60px}.brand{font-size:16px}.logo{height:31px;width:31px}.heading{align-items:center}.heading h1{font-size:24px}.heading p{font-size:11px}.button-primary{padding:10px 12px;font-size:11px}.hero{border-radius:17px;padding:17px}.hero h2{font-size:16px}.hero-right strong{font-size:27px}.hero-link{right:18px;bottom:12px}.stats{gap:7px;margin:12px 0 21px}.stat{padding:12px 11px;border-radius:12px}.stat strong{font-size:19px}.stat-label,.stat small{font-size:9px}.task{padding:13px 12px;gap:9px}.task-title{font-size:12px}.task-time{font-size:9px}.project-cards{grid-template-columns:1fr}.filters{flex-wrap:wrap}.filters input{flex:1;min-width:120px}.heading{align-items:center;flex-wrap:wrap;gap:9px}.heading-actions{width:100%;justify-content:flex-end}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar"><div class="brand"><div class="logo">日</div><span>日序</span></div><div class="top-right"><span class="date-label" id="todayLabel"></span><button class="install-help" onclick="showInstallHelp()">安装到主屏幕</button><div class="avatar">我</div></div></header>
    <div class="layout">
      <aside class="sidebar">
        <p class="nav-label">工作空间</p><nav class="nav"><button class="active" data-page="today"><span class="ico">◷</span>今日工作台</button><button data-page="projects"><span class="ico">▦</span>项目管理</button><button data-page="history"><span class="ico">↗</span>完成归档</button></nav>
        <p class="nav-label">我的项目</p><div id="sideProjects"></div><div class="side-footer">✦ &nbsp;每一天都在向目标靠近。<br/>你的计划只保存在这台设备上。</div>
      </aside>
      <main class="content">
        <section class="page show" id="page-today">
          <div class="heading"><div><div class="eyebrow">PERSONAL PLANNER</div><h1>早上好，今天也加油。</h1><p id="dateText"></p></div><div class="heading-actions"><button class="button-quiet" onclick="document.getElementById('projectImport').click()">导入项目</button><button class="button-quiet" onclick="exportBackup()">导出备份</button><button class="button-primary" onclick="openTaskModal()">＋ 新建待办</button></div></div>
          <div class="hero"><div><div class="hero-label">正在推进</div><h2 id="heroName"></h2><p id="heroGoal"></p></div><div class="hero-right"><strong id="heroPercent"></strong><small>当前进度</small></div><a href="#" class="hero-link" onclick="showPage('projects');return false">查看项目 →</a></div>
          <div class="stats"><div class="stat"><div class="stat-label">今日待办</div><strong id="statTodo">0</strong><small>项待完成</small></div><div class="stat"><div class="stat-label">已完成</div><strong id="statDone">0</strong><small>项完成</small></div><div class="stat"><div class="stat-label">进行中项目</div><strong id="statProjects">0</strong><small>个项目</small></div></div>
          <div class="section-head"><h3>今天要做</h3><span id="taskCount"></span></div><div class="task-list" id="todayTasks"></div>
          <div class="lower-grid"><div class="panel"><div class="section-head"><h3>项目进度</h3><button class="button-quiet" onclick="showPage('projects')">全部项目 →</button></div><div id="projectProgress"></div></div><div class="panel"><div class="section-head"><h3>当前阶段目标</h3><span>目标视图</span></div><div id="goalView"></div></div></div>
        </section>
        <section class="page" id="page-projects"><div class="heading"><div><div class="eyebrow">YOUR PROJECTS</div><h1>项目管理</h1><p>把长期目标拆解成看得见的进度。</p></div><button class="button-primary" onclick="openProjectModal()">＋ 新建项目</button></div><div class="project-cards" id="projectCards"></div></section>
        <section class="page" id="page-history"><div class="heading"><div><div class="eyebrow">COMPLETED & HISTORY</div><h1>完成归档</h1><p>做过的每一步，都会留下记录。</p></div></div><div class="filters"><input id="historySearch" placeholder="搜索任务或项目…" oninput="renderHistory()"><input type="date" id="historyDate" onchange="renderHistory()"><select id="historyProject" onchange="renderHistory()"><option value="">所有项目</option></select></div><div class="task-list" id="historyTasks"></div></section>
      </main>
    </div>
  </div>
  <nav class="mobile-nav"><button class="active" data-page="today"><span class="ico">◷</span>今天</button><button data-page="projects"><span class="ico">▦</span>项目</button><button data-page="history"><span class="ico">↗</span>归档</button></nav>
  <input id="projectImport" type="file" accept=".json,application/json" hidden onchange="importProjects(event)"><div class="modal-backdrop" id="modalBackdrop" onclick="backdropClose(event)"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
  <script>
    const key='日序.app.v3';
    const localDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
    const id=()=>Math.random().toString(36).slice(2,10);
    const dateOffset=n=>{const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
    const initial={projects:[],tasks:[]};
    let data;try{data=JSON.parse(localStorage.getItem(key))||initial}catch(e){data=initial}
    const privateImport=new URLSearchParams(location.hash.slice(1)).get('device-import');
    if(privateImport){try{const encoded=privateImport.replace(/-/g,'+').replace(/_/g,'/');const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));const payload=JSON.parse(new TextDecoder().decode(bytes));const existing=data.projects||[];const additions=(payload.projects||[]).filter(p=>!existing.some(x=>x.id===p.id));data={...data,projects:[...existing,...additions],tasks:data.tasks||[]};localStorage.setItem(key,JSON.stringify(data));}catch(e){}history.replaceState(null,'',location.pathname+location.search)}
    function save(){localStorage.setItem(key,JSON.stringify(data));render()}

    async function importProjects(event){const file=event.target.files?.[0];if(!file)return;try{const payload=JSON.parse((await file.text()).replace(/^\uFEFF/,''));const incoming=Array.isArray(payload)?payload:payload.projects;if(!Array.isArray(incoming)||!incoming.length)throw new Error('empty');const ids=new Set(data.projects.map(p=>p.id));const valid=incoming.filter(p=>p&&p.id&&p.name&&p.goal);const additions=valid.filter(p=>!ids.has(p.id));data.projects.push(...additions);const incomingTasks=Array.isArray(payload.tasks)?payload.tasks:[];const taskIds=new Set(data.tasks.map(t=>t.id));data.tasks.push(...incomingTasks.filter(t=>t&&t.id&&!taskIds.has(t.id)));save();toast(additions.length?('已导入 '+additions.length+' 个项目'):'项目已导入或已存在');}catch(e){toast('导入失败，请选择日序项目 JSON 文件')}event.target.value=''}
    function exportBackup(){const payload={format:'rixu-backup-v1',exportedAt:new Date().toISOString(),projects:data.projects,tasks:data.tasks};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='日序备份-'+localDate()+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('备份已导出，请在“文件”中查找下载项')}
    function pName(pid){return data.projects.find(p=>p.id===pid)?.name||'个人事务'}
    function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function priorityTag(p){return p===1?'<span class="tag high">高优先级</span>':p===2?'<span class="tag medium">中优先级</span>':'<span class="tag low">低优先级</span>'}
    function taskCard(t){return `<article class="task ${t.status==='done'?'done':''}"><input class="check" type="checkbox" ${t.status==='done'?'checked':''} onchange="toggleTask('${t.id}')" aria-label="标记完成"><div><div class="task-title">${esc(t.title)}</div><div class="task-meta">${priorityTag(t.priority)}<span>◷ ${esc(t.time||'无提醒')}</span><span>▦ ${esc(pName(t.projectId))}</span></div></div><div class="task-actions"><button class="icon-btn" title="编辑" onclick="editTask('${t.id}')">⋯</button></div></article>`}
    function render(){
      const d=new Date();document.getElementById('todayLabel').textContent=d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});document.getElementById('dateText').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})+' · 留一点时间给自己';
      document.getElementById('sideProjects').innerHTML=data.projects.filter(p=>p.status==='active').map((p,i)=>`<div class="side-project"><i class="dot ${i===1?'amber':i===2?'blue':''}"></i>${esc(p.name)}</div>`).join('');
      const p=data.projects.filter(x=>x.status==='active').sort((a,b)=>(a.deadline||'9999-12-31').localeCompare(b.deadline||'9999-12-31'))[0]||data.projects[0];document.getElementById('heroName').textContent=p?.name||'开始创建你的第一个项目';document.getElementById('heroGoal').textContent=p?.goal||'设定目标，开始记录每一步。';document.getElementById('heroPercent').textContent=(p?.progress||0)+'%';
      const today=data.tasks.filter(t=>t.date===localDate());const todo=today.filter(t=>t.status!=='done'&&t.status!=='cancelled').sort((a,b)=>a.priority-b.priority);const done=today.filter(t=>t.status==='done');document.getElementById('statTodo').textContent=todo.length;document.getElementById('statDone').textContent=done.length;document.getElementById('statProjects').textContent=data.projects.filter(x=>x.status==='active').length;document.getElementById('taskCount').textContent=`${todo.length} 项待完成 · ${done.length} 项已完成`;
      document.getElementById('todayTasks').innerHTML=[...todo,...done].map(taskCard).join('')||'<div class="empty">今天还没有待办，添加一项开始吧。</div>';
      document.getElementById('projectProgress').innerHTML=data.projects.filter(x=>x.status==='active').map(x=>`<div class="project-row"><div class="project-title-line"><span>${esc(x.name)}</span><small>${x.progress}%</small></div><div class="bar"><i style="width:${x.progress}%"></i></div><div class="project-sub"><span>下一阶段：${esc(x.milestones.find(m=>m.status==='current')?.title||'即将开始')}</span><span>${daysLeft(x.deadline)}</span></div></div>`).join('')||'<div class="empty">还没有进行中的项目</div>';
      const current=p?.milestones.find(m=>m.status==='current');const next=p?.milestones.filter(m=>m.status!=='done'&&m!==current)||[];document.getElementById('goalView').innerHTML=(current?`<div class="goal-item"><div class="goal-mark">◎</div><div class="goal-copy"><strong>当前阶段 · ${esc(current.title)}</strong><p>项目进度达到 ${current.target}% 时完成 · 当前 ${p.progress}%</p></div></div>`:'')+(next.slice(0,2).map(m=>`<div class="goal-item"><div class="goal-mark">↗</div><div class="goal-copy"><strong>后续目标 · ${esc(m.title)}</strong><p>对应项目进度 ${m.target}%</p></div></div>`).join('')||'<div class="goal-item"><div class="goal-copy"><strong>总体目标</strong><p>'+esc(p?.goal||'创建项目后设置总体目标')+'</p></div></div>');
      document.getElementById('projectCards').innerHTML=data.projects.map(x=>`<article class="project-card" onclick="openProjectDetail('${x.id}')"><div class="card-top"><i class="dot"></i>${priorityTag(x.priority)}</div><h3>${esc(x.name)}</h3><p>${esc(x.goal)}</p><div class="bar"><i style="width:${x.progress}%"></i></div><div class="card-progress"><span>${x.progress}% 已完成</span><span>${daysLeft(x.deadline)}</span></div></article>`).join('')||'<div class="empty">还没有项目，创建一个目标吧。</div>';
      const select=document.getElementById('historyProject');const val=select.value;select.innerHTML='<option value="">所有项目</option>'+data.projects.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');select.value=val;renderHistory();
    }
    function daysLeft(s){if(!s)return '未设截止日';const n=Math.ceil((new Date(s+'T23:59:59')-new Date())/86400000);return n<0?`逾期 ${Math.abs(n)} 天`:`剩余 ${n} 天`}
    function renderHistory(){const q=(document.getElementById('historySearch')?.value||'').toLowerCase(),date=document.getElementById('historyDate')?.value||'',project=document.getElementById('historyProject')?.value||'';let arr=data.tasks.filter(t=>t.status==='done'||t.status==='cancelled').filter(t=>(!q||(t.title+' '+pName(t.projectId)).toLowerCase().includes(q))&&(!date||t.date===date)&&(!project||t.projectId===project)).sort((a,b)=>(b.completedAt||b.date).localeCompare(a.completedAt||a.date));document.getElementById('historyTasks').innerHTML=arr.map(t=>taskCard(t)+`<div style="margin:-5px 0 8px 34px;font-size:10px;color:#9aa29b">完成于 ${t.completedAt?new Date(t.completedAt).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):t.date}</div>`).join('')||'<div class="empty">没有找到符合条件的归档事项。</div>'}
    function toggleTask(tid){const t=data.tasks.find(x=>x.id===tid);t.status=t.status==='done'?'todo':'done';t.completedAt=t.status==='done'?new Date().toISOString():null;save();toast(t.status==='done'?'已完成，已收入归档':'已重新打开')}
    function showPage(name){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('show',x.id==='page-'+name));document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===name));window.scrollTo({top:0,behavior:'smooth'})}
    document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));
    function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBackdrop').classList.add('open')}
    function showInstallHelp(){openModal(`<div class="modal-head"><h2>添加「日序」到主屏幕</h2><button class="close" onclick="closeModal()">×</button></div><ol class="install-steps"><li>请在 iPhone 的 <strong>Safari</strong> 中打开这个网页。</li><li>点底部的<strong>分享</strong>按钮（方框向上箭头）。</li><li>向下滑动，点<strong>添加到主屏幕</strong>。</li><li>确认名称为「日序」，再点<strong>添加</strong>。</li></ol><div class="install-note">安装后可像 App 一样从主屏幕打开。首次打开后，工作台和数据都保存在本机；提醒目前依赖网页处于打开状态。</div><div class="modal-actions"><button class="button-primary" onclick="closeModal()">知道了</button></div>`)}
    function closeModal(){document.getElementById('modalBackdrop').classList.remove('open')}
    function backdropClose(e){if(e.target.id==='modalBackdrop')closeModal()}
    function projectOptions(selected=''){return '<option value="">个人事务（不关联项目）</option>'+data.projects.map(p=>`<option value="${p.id}" ${selected===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
    function openTaskModal(t=null){const editing=!!t;openModal(`<div class="modal-head"><h2>${editing?'编辑待办':'新建待办'}</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveTask(event,'${t?.id||''}')"><div class="field"><label>待办事项</label><input name="title" required placeholder="例如：完成项目方案初稿" value="${esc(t?.title||'')}"></div><div class="form-grid"><div class="field"><label>所属项目</label><select name="projectId">${projectOptions(t?.projectId||'')}</select></div><div class="field"><label>优先级</label><select name="priority"><option value="1" ${t?.priority===1?'selected':''}>高</option><option value="2" ${!t||t.priority===2?'selected':''}>中</option><option value="3" ${t?.priority===3?'selected':''}>低</option></select></div><div class="field"><label>安排日期</label><input type="date" name="date" value="${t?.date||localDate()}" required></div><div class="field"><label>提醒时间</label><input type="time" name="time" value="${t?.time||''}"></div></div><div class="field"><label>备注</label><textarea name="note" placeholder="补充一点上下文…">${esc(t?.note||'')}</textarea></div><div class="modal-actions">${editing?`<button type="button" class="button-quiet" onclick="deleteTask('${t.id}')">删除</button>`:''}<button type="button" class="button-quiet" onclick="closeModal()">取消</button><button class="button-primary">保存待办</button></div></form>`)}
    function saveTask(e,tid){e.preventDefault();const f=new FormData(e.target),t=tid?data.tasks.find(x=>x.id===tid):{id:id(),status:'todo',source:'manual'};Object.assign(t,{title:f.get('title').trim(),projectId:f.get('projectId')||null,priority:+f.get('priority'),date:f.get('date'),time:f.get('time'),note:f.get('note'),source:'manual'});if(!tid)data.tasks.push(t);closeModal();save();toast('待办已保存')}
    function editTask(tid){openTaskModal(data.tasks.find(x=>x.id===tid))}
    function deleteTask(tid){data.tasks=data.tasks.filter(x=>x.id!==tid);closeModal();save();toast('待办已删除')}
    function openProjectModal(){openModal(`<div class="modal-head"><h2>创建项目</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveProject(event)"><div class="field"><label>项目名称</label><input name="name" required placeholder="给这个目标一个名字"></div><div class="field"><label>总体目标</label><textarea name="goal" required placeholder="完成后，你希望达成什么？"></textarea></div><div class="form-grid"><div class="field"><label>开始日期</label><input type="date" name="start" value="${localDate()}" required></div><div class="field"><label>截止日期</label><input type="date" name="deadline" value="${dateOffset(30)}" required></div><div class="field"><label>优先级</label><select name="priority"><option value="1">高</option><option value="2" selected>中</option><option value="3">低</option></select></div><div class="field"><label>当前进度（%）</label><input type="number" min="0" max="100" name="progress" value="0"></div></div><div class="field"><label>阶段目标（每行一项，按顺序）</label><textarea name="milestones" placeholder="完成调研（30）&#10;完成初稿（70）&#10;正式交付（100）"></textarea></div><div class="modal-actions"><button type="button" class="button-quiet" onclick="closeModal()">取消</button><button class="button-primary">创建项目</button></div></form>`)}
    function saveProject(e){e.preventDefault();const f=new FormData(e.target),progress=+f.get('progress'),ms=(f.get('milestones')||'').split('\n').map(x=>x.trim()).filter(Boolean).map((line,i)=>{const match=line.match(/(.+?)(?:\s*[（(](\d{1,3})[）)])?$/);return{id:id(),title:match[1].trim(),target:+(match[2]||Math.round((i+1)*100/((f.get('milestones')||'').split('\n').filter(Boolean).length||1))),status:'upcoming'}});if(ms.length){let found=false;ms.forEach(m=>{if(!found&&m.target>progress){m.status='current';found=true}else if(m.target<=progress)m.status='done'})}const p={id:id(),name:f.get('name').trim(),goal:f.get('goal').trim(),start:f.get('start'),deadline:f.get('deadline'),priority:+f.get('priority'),progress,status:'active',milestones:ms,history:progress? [{id:id(),old:0,next:progress,note:'创建项目时设置初始进度',at:new Date().toISOString()}]:[]};data.projects.push(p);closeModal();save();toast('项目已创建')}
    function openProjectDetail(pid){const p=data.projects.find(x=>x.id===pid);openModal(`<div class="modal-head"><h2>${esc(p.name)}</h2><button class="close" onclick="closeModal()">×</button></div><p style="font-size:12px;color:#7e8980;line-height:1.6">${esc(p.goal)}</p><div class="bar"><i style="width:${p.progress}%"></i></div><div style="font-size:12px;color:#69756b;margin:7px 0 18px">当前进度 ${p.progress}% · 截止 ${p.deadline||'未设'} · ${daysLeft(p.deadline)}</div><div class="field"><label>更新进度</label><div style="display:flex;gap:8px"><input id="progressInput" type="number" min="0" max="100" value="${p.progress}" style="flex:1;border:1px solid #e5e9e3;border-radius:9px;padding:10px"><button class="button-primary" onclick="updateProgress('${p.id}')">更新</button></div></div><div class="field"><label>本次进度备注</label><textarea id="progressNote" placeholder="记录本次完成了什么…"></textarea></div><div class="section-head"><h3>阶段目标</h3></div>${p.milestones.map(m=>`<div class="goal-item"><div class="goal-mark">${m.status==='done'?'✓':m.status==='current'?'◎':'↗'}</div><div class="goal-copy"><strong>${esc(m.title)}</strong><p>${m.status==='done'?'已完成':m.status==='current'?'当前阶段':`目标进度 ${m.target}%`} · ${m.target}%</p></div></div>`).join('')||'<p style="font-size:11px;color:#929a93">尚未设置阶段目标。</p>'}<div class="section-head" style="margin-top:19px"><h3>进度历史</h3></div><div class="timeline">${p.history.slice().sort((a,b)=>b.at.localeCompare(a.at)).map(h=>`<div class="timeline-entry"><strong>${h.old}% → ${h.next}%</strong><p>${esc(h.note||'进度更新')}</p><small>${new Date(h.at).toLocaleString('zh-CN')}</small></div>`).join('')||'<div class="timeline-entry"><p>还没有进度变更记录。</p></div>'}</div>`)}
    function updateProgress(pid){const p=data.projects.find(x=>x.id===pid),n=Math.max(0,Math.min(100,+document.getElementById('progressInput').value||0)),note=document.getElementById('progressNote').value.trim();p.history.unshift({id:id(),old:p.progress,next:n,note,at:new Date().toISOString()});p.progress=n;p.milestones.forEach(m=>m.status=m.target<=n?'done':'upcoming');const current=p.milestones.find(m=>m.status==='upcoming');if(current)current.status='current';closeModal();save();toast('进度已更新，历史已记录')}
    let toastTimer;function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
    function ensureDailyTasks(){
      const today=localDate();let changed=false;
      for(const p of data.projects){
        if(p.status!=='active'||p.progress>=100)continue;
        if(p.kind==='实验')continue;
        if(p.kind==='副线'&&!['Mon','Wed','Fri'].includes(new Date().toLocaleDateString('en-US',{weekday:'short'})))continue;
        const stage=p.milestones.find(m=>m.status==='current')||p.milestones.find(m=>m.target>p.progress);
        if(!stage)continue;
        const generationKey=`auto:${p.id}:${today}:${stage.id}`;
        if(data.tasks.some(t=>t.generationKey===generationKey||t.date===today&&t.projectId===p.id&&t.source==='generated'))continue;
        const days=Math.ceil((new Date(p.deadline+'T23:59:59')-new Date())/86400000);
        data.tasks.push({id:id(),projectId:p.id,milestoneId:stage.id,title:`推进阶段目标：${stage.title}`,date:today,priority:days<=3?1:p.priority,status:'todo',time:'',source:'generated',note:`根据项目进度 ${p.progress}% 与截止日期自动生成`,generationKey});
        changed=true;
      }
      if(changed)localStorage.setItem(key,JSON.stringify(data));
    }
    ensureDailyTasks();render();
    if(window.matchMedia('(display-mode: standalone)').matches||navigator.standalone)document.querySelector('.install-help').hidden=true;
    if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  </script>
</body>
</html>
